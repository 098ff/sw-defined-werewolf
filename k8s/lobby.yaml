apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobby
  namespace: werewolf
  labels:
    app: lobby
    component: handler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby
  template:
    metadata:
      labels:
        app: lobby
        component: handler
    spec:
      nodeSelector:
        node-role: pi
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 10
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 10
      containers:
      - name: lobby
        image: werewolf/lobby:v1.0
        imagePullPolicy: IfNotPresent
        # [TODO-01-B]: Sync with Role 3 (Thanyaporn): Lobby port 8000, GAMEMASTER_URL, REDIS_URL, memory <= 160Mi
        ports:
        - containerPort: 8000
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: STATE_STORE_BACKEND
          value: "redis"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: GAMEMASTER_URL
          value: "http://gamemaster:8000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "160Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lobby
  namespace: werewolf
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: lobby
