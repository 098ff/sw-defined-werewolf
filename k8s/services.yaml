# Auxiliary Services Manifest
# Note: Service definitions are also colocated in each deployment manifest (redis, gateway, frontend, lobby, gamemaster, chat).
# This file serves as a manifest for fast service-only re-application.
apiVersion: v1
kind: Service
metadata:
  name: services-health-ping
  namespace: werewolf
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: gateway
