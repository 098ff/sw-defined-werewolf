apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: werewolf
  labels:
    app: frontend
    component: handler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: handler
    spec:
      nodeSelector:
        node-role: pi
      affinity:
        # Soft spread: prefer one handler per Pi so every Pi runs a service,
        # but allow co-location when a Pi is down
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values: ["handler"]
              topologyKey: "kubernetes.io/hostname"
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 10
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 10
      containers:
      - name: frontend
        image: werewolf/frontend:v1.0
        imagePullPolicy: IfNotPresent
        # [TODO-01-A]: Sync with Role 2 (Khanapong): Nginx port 80, static React build, health endpoints
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "16Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: werewolf
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: frontend
