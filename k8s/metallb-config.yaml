apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: werewolf-ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.0.240-192.168.0.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: werewolf-l2-advert
  namespace: metallb-system
spec:
  ipAddressPools:
  - werewolf-ip-pool
