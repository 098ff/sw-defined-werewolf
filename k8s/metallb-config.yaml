apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: werewolf-ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.0.240-192.168.0.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: werewolf-l2-advert
  namespace: metallb-system
spec:
  ipAddressPools:
  - werewolf-ip-pool
  # Announce only from the master VM, which also holds 192.168.0.240 on enp0s8
  # so the kernel learns WiFi clients' MACs from their ARP requests
  nodeSelectors:
  - matchLabels:
      node-role: control-plane
